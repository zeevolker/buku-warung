<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Buku Warung: Stok Barang</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1f7a4d">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>
  <main>
    <nav>
      <a href="index.html">Catat Cepat</a>
      <a href="ringkasan.html">Ringkasan</a>
      <a href="stok.html" aria-current="page">Stok</a>
    </nav>
    <h1>Stok Barang</h1>

    <form id="form-barang" class="form-barang" onsubmit="return false">
      <label for="nama">Nama barang</label>
      <input id="nama" type="text" maxlength="40" placeholder="contoh: minyak goreng">

      <div class="baris-input">
        <div>
          <label for="jumlah-awal">Jumlah</label>
          <input id="jumlah-awal" type="number" inputmode="numeric" min="0" placeholder="10">
        </div>
        <div>
          <label for="harga">Harga jual (Rp)</label>
          <input id="harga" type="text" inputmode="numeric" autocomplete="off" placeholder="18.000">
        </div>
      </div>

      <p id="pesan" role="alert"></p>
      <button type="button" id="btn-tambah" class="tambah">Tambah Barang</button>
    </form>

    <h2>Daftar barang</h2>
    <ul id="daftar-barang"></ul>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/stok.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
