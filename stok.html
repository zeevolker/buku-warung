<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Buku Warung: Stok Barang</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1f7a4d">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>
  <main>
    <h1>Stok Barang</h1>

    <form id="form-barang" class="form-barang" onsubmit="return false">
      <label for="nama">Nama barang</label>
      <input id="nama" type="text" maxlength="40" placeholder="contoh: minyak goreng">

      <div class="baris-input">
        <div>
          <label for="jumlah-awal">Jumlah</label>
          <input id="jumlah-awal" type="number" inputmode="numeric" min="0" placeholder="10">
        </div>
        <div>
          <label for="harga">Harga jual (Rp)</label>
          <input id="harga" type="text" inputmode="numeric" autocomplete="off" placeholder="18.000">
        </div>
      </div>

      <p id="pesan" role="alert"></p>
      <button type="button" id="btn-tambah" class="tambah">Tambah Barang</button>
    </form>

    <h2>Daftar barang</h2>
    <ul id="daftar-barang"></ul>
  </main>

  <nav class="tabbar" aria-label="Menu utama">
    <a href="index.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      <span>Catat</span>
    </a>
    <a href="ringkasan.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10"/><path d="M12 20V4"/><path d="M19 20v-7"/></svg>
      <span>Ringkasan</span>
    </a>
    <a href="stok.html" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5Z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/></svg>
      <span>Stok</span>
    </a>
  </nav>

  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/stok.js"></script>
  <script src="js/pwa.js"></script>
</body>
</html>
