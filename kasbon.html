<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Buku Warung: Kasbon</title>
  <meta name="description" content="Pembukuan sederhana untuk warung: uang masuk, uang keluar, stok, dan kasbon.">
  <link rel="stylesheet" href="./src/css/style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1f7a4d">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>
  <main>
    <div class="kepala">
      <h1>Kasbon</h1>
      <a id="status-akun" class="status-akun" href="akun.html">Akun</a>
    </div>

    <section class="ringkas">
      <div class="utama">
        <span>Belum dibayar</span>
        <strong id="k-total">Rp 0</strong>
        <small id="k-jumlah" class="sub"></small>
      </div>
    </section>

    <form id="form-kasbon" class="form-barang" onsubmit="return false">
      <label for="k-nama">Nama pelanggan</label>
      <input id="k-nama" type="text" maxlength="40" list="daftar-nama" autocomplete="off" placeholder="contoh: Bu Sari">
      <datalist id="daftar-nama"></datalist>

      <label for="k-barang">Yang diutang</label>
      <select id="k-barang"></select>

      <div id="baris-jumlah-barang" hidden>
        <label for="k-jumlah-barang">Jumlah barang</label>
        <input id="k-jumlah-barang" type="number" inputmode="numeric" min="1" value="1">
      </div>

      <div class="baris-input">
        <div>
          <label for="k-nominal">Utang (Rp)</label>
          <input id="k-nominal" type="text" inputmode="numeric" autocomplete="off" placeholder="25.000">
        </div>
        <div>
          <label for="k-telepon">No. HP (opsional)</label>
          <input id="k-telepon" type="tel" inputmode="tel" autocomplete="off" placeholder="0812...">
        </div>
      </div>

      <label for="k-catatan">Catatan (boleh kosong)</label>
      <input id="k-catatan" type="text" maxlength="60" placeholder="contoh: beras 5 kg">

      <p id="k-pesan" role="alert"></p>
      <button type="button" id="btn-utang" class="tambah">Catat Utang</button>
    </form>

    <h2>Daftar pelanggan</h2>
    <ul id="daftar-pelanggan"></ul>
  </main>

  <nav class="tabbar" aria-label="Menu utama">
    <a href="index.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      <span>Catat</span>
    </a>
    <a href="riwayat.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/></svg>
      <span>Riwayat</span>
    </a>
    <a href="ringkasan.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10"/><path d="M12 20V4"/><path d="M19 20v-7"/></svg>
      <span>Ringkasan</span>
    </a>
    <a href="stok.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5Z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/></svg>
      <span>Stok</span>
    </a>
    <a href="kasbon.html" aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h12a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4Z"/><path d="M8 9h8"/><path d="M8 13h5"/></svg>
      <span>Kasbon</span>
    </a>
  </nav>

  <script type="module" src="./src/pages/kasbon.js"></script>
</body>
</html>
