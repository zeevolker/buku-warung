<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Buku Warung: Barang</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="./src/css/style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#fafaf8">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>
  <main class="halaman">
    <div class="baris-judul">
      <h1 class="judul-halaman">Barang</h1>
      <button type="button" class="tombol-kecil gelap" id="tombol-baru">
        <svg class="ikon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>Barang baru
      </button>
    </div>

    <div class="saring" role="group" aria-label="Saring barang">
      <button type="button" id="saring-semua" aria-pressed="true">Semua</button>
      <button type="button" id="saring-habis" aria-pressed="false">Hampir habis</button>
    </div>

    <label class="cari">
      <svg class="ikon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span class="sr-only">Cari barang</span>
      <input type="search" id="cari" placeholder="Cari barang" autocomplete="off">
    </label>

    <ul class="kartu-daftar" id="daftar-barang"></ul>
    <p class="petunjuk" style="text-align:center">Stok berubah sendiri saat Jual atau Belanja stok. Tekan barang untuk ubah harga atau koreksi stok.</p>
  </main>

  <dialog class="lembar pendek" id="lembar-barang" aria-labelledby="judul-lembar-barang">
    <div class="atas">
      <h2 id="judul-lembar-barang">Barang baru</h2>
      <button type="button" class="tombol-bulat" aria-label="Tutup" data-tutup>
        <svg class="ikon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div class="isi">
      <div class="bidang">
        <label for="b-nama">Nama barang</label>
        <input class="input" id="b-nama" maxlength="60" autocomplete="off" placeholder="contoh: Minyak goreng 1 L">
      </div>
      <div class="dua-kolom">
        <div class="bidang">
          <label for="b-jual">Harga jual</label>
          <input class="input" id="b-jual" inputmode="numeric" autocomplete="off" placeholder="Rp 0">
        </div>
        <div class="bidang">
          <label for="b-beli">Harga beli (modal)</label>
          <input class="input" id="b-beli" inputmode="numeric" autocomplete="off" placeholder="Rp 0">
        </div>
      </div>
      <div class="bidang">
        <label for="b-stok" id="label-stok">Stok sekarang</label>
        <input class="input" id="b-stok" type="number" inputmode="numeric" min="0" placeholder="0">
        <p class="petunjuk" id="info-stok"></p>
      </div>
      <p class="pesan-galat" id="b-galat" role="alert"></p>
    </div>
    <div class="bawah">
      <button type="button" class="tombol penuh" id="b-simpan">Simpan</button>
      <button type="button" class="tombol-garis penuh tombol-bahaya" id="b-hapus">Hapus barang</button>
    </div>
  </dialog>

  <nav class="tab-bar" aria-label="Menu utama">
    <a href="index.html"><svg class="ikon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/></svg>Beranda</a>
    <a href="laporan.html"><svg class="ikon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10"/><path d="M12 20V4"/><path d="M19 20v-7"/></svg>Laporan</a>
    <a href="barang.html" aria-current="page"><svg class="ikon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5Z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/></svg>Barang</a>
    <a href="pelanggan.html"><svg class="ikon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0"/><path d="M17 4a4 4 0 0 1 0 8"/><path d="M22 21a7 7 0 0 0-4-6.3"/></svg>Pelanggan</a>
  </nav>

  <script type="module" src="./src/pages/barang.js"></script>
</body>
</html>
