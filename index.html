<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Buku Warung</title>
  <meta name="description" content="Pembukuan sederhana untuk warung: jual, uang keluar, stok, dan utang pelanggan.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="./src/css/style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#fafaf8">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>
  <main class="halaman">
    <header class="kepala">
      <div class="kepala-teks">
        <h1 class="nama-warung" id="nama-warung">Buku Warung</h1>
        <span class="status-simpan" id="status-simpan" role="status"></span>
      </div>
      <a href="akun.html" class="avatar tamu" id="avatar" aria-label="Akun"></a>
    </header>
    <a href="akun.html" class="tombol penuh ajak-masuk" id="ajak-masuk" hidden>Masuk supaya data aman</a>
    <p class="tanggal-hari" id="tanggal-hari"></p>

    <section class="angka-besar" aria-label="Uang hari ini">
      <span class="label">Uang di laci hari ini</span>
      <span class="nilai" id="laci">Rp 0</span>
      <span class="rincian">
        <span>Masuk <span class="masuk-teks" id="masuk">Rp 0</span></span>
        <span>Keluar <span class="keluar-teks" id="keluar">Rp 0</span></span>
      </span>
    </section>

    <div class="aksi-utama">
      <button type="button" class="utama" id="tombol-jual">
        <svg class="ikon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg>Jual
      </button>
      <button type="button" id="tombol-keluar">
        <svg class="ikon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg>Keluar
      </button>
      <button type="button" id="tombol-bayar">
        <svg class="ikon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>Terima bayar
      </button>
    </div>

    <a href="pelanggan.html" class="kartu-tautan" id="kartu-utang" hidden>
      <span class="isi">
        <span class="kecil">Belum dibayar pelanggan</span>
        <span class="besar"><span id="total-utang">Rp 0</span> <span class="kecil" id="jumlah-berutang"></span></span>
      </span>
      <svg class="ikon redup" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
    </a>

    <section aria-labelledby="judul-hari-ini">
      <h2 id="judul-hari-ini">Hari ini</h2>
      <ul class="daftar" id="daftar-hari-ini"></ul>
    </section>
  </main>

  <!-- ===== Lembar Jual ===== -->
  <dialog class="lembar" id="lembar-jual" aria-labelledby="judul-jual">
    <div class="atas">
      <h2 id="judul-jual">Jual</h2>
      <button type="button" class="tombol-bulat" aria-label="Tutup" data-tutup>
        <svg class="ikon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div class="isi">
      <label class="cari">
        <svg class="ikon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <span class="sr-only">Cari barang</span>
        <input type="search" id="cari-barang" placeholder="Cari barang" autocomplete="off">
      </label>
      <div id="daftar-jual"></div>

      <div class="bidang">
        <label for="jual-lainnya">Lainnya (gorengan, pulsa, dll.)</label>
        <div class="dua-kolom">
          <input class="input" id="jual-lainnya" inputmode="numeric" autocomplete="off" placeholder="Rp 0">
          <input class="input" id="jual-keterangan" autocomplete="off" placeholder="Keterangan" aria-label="Keterangan barang lainnya">
        </div>
      </div>

      <fieldset class="bidang" style="border:0;margin:0;padding:0">
        <legend class="label" style="margin-bottom:8px">Dibayar</legend>
        <div class="segmen">
          <label><input type="radio" name="dibayar" value="sekarang" checked><span>Sekarang</span></label>
          <label><input type="radio" name="dibayar" value="nanti"><span>Nanti (kasbon)</span></label>
        </div>
      </fieldset>

      <div class="bidang" id="bidang-pelanggan-jual" hidden>
        <label for="jual-pelanggan">Siapa yang utang?</label>
        <input class="input" id="jual-pelanggan" list="saran-pelanggan" autocomplete="off" placeholder="Nama pelanggan">
        <div class="deret-chip" id="chip-pelanggan-jual"></div>
      </div>
      <p class="pesan-galat" id="jual-galat" role="alert"></p>
    </div>
    <div class="bawah">
      <p class="petunjuk" id="jual-petunjuk"></p>
      <button type="button" class="tombol penuh tombol-simpan" id="simpan-jual"><span>Simpan</span><span id="jual-total">Rp 0</span></button>
    </div>
  </dialog>

  <!-- ===== Lembar Uang keluar ===== -->
  <dialog class="lembar" id="lembar-keluar" aria-labelledby="judul-keluar">
    <div class="atas">
      <h2 id="judul-keluar">Uang keluar</h2>
      <button type="button" class="tombol-bulat" aria-label="Tutup" data-tutup>
        <svg class="ikon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div class="isi">
      <div class="bidang">
        <label for="keluar-nominal" class="redup" style="font-weight:500">Berapa?</label>
        <input class="input-besar" id="keluar-nominal" inputmode="numeric" autocomplete="off" placeholder="Rp 0" autofocus>
      </div>

      <fieldset class="pilihan-kartu">
        <legend class="label" style="margin-bottom:10px">Untuk apa?</legend>
        <label><input type="radio" name="untuk" value="belanja" checked><span class="teks"><span class="judul">Belanja stok</span><span class="kecil">Stok barang otomatis bertambah</span></span></label>
        <label><input type="radio" name="untuk" value="biaya"><span class="teks"><span class="judul">Biaya warung</span><span class="kecil">Listrik, plastik, gas, sewa</span></span></label>
        <label><input type="radio" name="untuk" value="pinjaman"><span class="teks"><span class="judul">Dipinjam pelanggan</span><span class="kecil">Masuk ke utang pelanggan</span></span></label>
      </fieldset>

      <div class="kotak-abu" id="keluar-belanja">
        <span class="label">Barang yang dibeli</span>
        <div style="display:grid;grid-template-columns:minmax(0,1fr) 88px;gap:10px">
          <select class="input" id="keluar-barang" aria-label="Barang yang dibeli"></select>
          <input class="input" id="keluar-jumlah" type="number" inputmode="numeric" min="1" placeholder="Jumlah" aria-label="Jumlah barang">
        </div>
        <p class="petunjuk" id="keluar-info-belanja"></p>
      </div>

      <div class="bidang" id="keluar-pinjaman" hidden>
        <label for="keluar-pelanggan">Siapa yang pinjam?</label>
        <input class="input" id="keluar-pelanggan" list="saran-pelanggan" autocomplete="off" placeholder="Nama pelanggan">
      </div>

      <div class="bidang" id="keluar-biaya" hidden>
        <label for="keluar-keterangan">Keterangan (boleh kosong)</label>
        <input class="input" id="keluar-keterangan" autocomplete="off" placeholder="contoh: token listrik">
      </div>
      <p class="pesan-galat" id="keluar-galat" role="alert"></p>
    </div>
    <div class="bawah">
      <button type="button" class="tombol penuh" id="simpan-keluar">Simpan</button>
    </div>
  </dialog>

  <!-- ===== Lembar Terima bayar ===== -->
  <dialog class="lembar pendek" id="lembar-bayar" aria-labelledby="judul-bayar">
    <div class="atas">
      <h2 id="judul-bayar">Terima bayar</h2>
      <button type="button" class="tombol-bulat" aria-label="Tutup" data-tutup>
        <svg class="ikon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>
    <div class="isi">
      <div class="bidang">
        <label for="bayar-pelanggan">Dari siapa?</label>
        <select class="input" id="bayar-pelanggan"></select>
      </div>
      <div class="bidang">
        <label for="bayar-nominal">Berapa?</label>
        <input class="input" id="bayar-nominal" inputmode="numeric" autocomplete="off" placeholder="Rp 0">
        <p class="petunjuk" id="bayar-info"></p>
      </div>
      <p class="pesan-galat" id="bayar-galat" role="alert"></p>
    </div>
    <div class="bawah">
      <button type="button" class="tombol penuh" id="simpan-bayar">Simpan</button>
    </div>
  </dialog>

  <datalist id="saran-pelanggan"></datalist>

  <nav class="tab-bar" aria-label="Menu utama">
    <a href="index.html" aria-current="page"><svg class="ikon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"/></svg>Beranda</a>
    <a href="laporan.html"><svg class="ikon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20V10"/><path d="M12 20V4"/><path d="M19 20v-7"/></svg>Laporan</a>
    <a href="barang.html"><svg class="ikon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5Z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/></svg>Barang</a>
    <a href="pelanggan.html"><svg class="ikon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="4"/><path d="M2 21a7 7 0 0 1 14 0"/><path d="M17 4a4 4 0 0 1 0 8"/><path d="M22 21a7 7 0 0 0-4-6.3"/></svg>Pelanggan</a>
  </nav>

  <script type="module" src="./src/pages/beranda.js"></script>
</body>
</html>
