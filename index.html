<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Buku Warung: Catat Cepat</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1f7a4d">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>
  <main>
    <h1>Catat Cepat</h1>
    <p id="tanggal-hari-ini" class="tanggal"></p>

    <section class="ringkas" aria-label="Ringkasan hari ini">
      <div><span>Uang masuk</span><strong id="total-masuk">Rp 0</strong></div>
      <div><span>Uang keluar</span><strong id="total-keluar">Rp 0</strong></div>
      <div class="utama"><span>Total hari ini</span><strong id="total">Rp 0</strong></div>
    </section>

    <p id="banner-ubah" class="banner" hidden>
      <span id="banner-teks">Sedang mengubah catatan. Pilih Uang Masuk atau Uang Keluar untuk menyimpan.</span>
      <button type="button" id="batal-ubah">Batal</button>
    </p>

    <form id="form-catat" onsubmit="return false">
      <label for="nominal">Nominal (Rp)</label>
      <input id="nominal" type="text" inputmode="numeric" autocomplete="off" placeholder="contoh: 15.000">
      <div class="cepat" aria-label="Tambah nominal cepat">
        <button type="button" data-tambah="1000">+1.000</button>
        <button type="button" data-tambah="5000">+5.000</button>
        <button type="button" data-tambah="10000">+10.000</button>
        <button type="button" data-tambah="50000">+50.000</button>
      </div>

      <label for="catatan">Catatan (boleh kosong)</label>
      <input id="catatan" type="text" maxlength="60" placeholder="contoh: jual gorengan">

      <p id="pesan" role="alert"></p>
      <p id="info" role="status"></p>

      <div class="tombol">
        <button type="button" id="btn-masuk" class="masuk">Uang Masuk</button>
        <button type="button" id="btn-keluar" class="keluar">Uang Keluar</button>
      </div>
    </form>

    <h2>Catatan hari ini</h2>
    <ul id="daftar"></ul>
  </main>

  <nav class="tabbar" aria-label="Menu utama">
    <a href="index.html" aria-current="page">

      <span>Catat</span>

      <span>Ringkasan</span>
    </a>
    <a href="stok.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8 12 3 3 8v8l9 5 9-5Z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/></svg>

    <a href="kasbon.html">

    </a>

  <script src="js/storage.js"></script>

</body>
</html>
