<head>

    <p id="judul-tanggal" class="tanggal"></p>

    <section class="ringkas" aria-label="Total pada tanggal ini">
      <div><span>Uang masuk</span><strong id="r-masuk">Rp 0</strong></div>
      <div><span>Uang keluar</span><strong id="r-keluar">Rp 0</strong></div>
      <div class="utama"><span>Total</span><strong id="r-total">Rp 0</strong></div>

    <button type="button" id="btn-bagikan" class="sekunder">Bagikan ke WhatsApp</button>

    <h2>Catatan</h2>
    <ul id="daftar-riwayat"></ul>
